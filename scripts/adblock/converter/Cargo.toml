[package]
name = "dc-adblock-converter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Build-time converter: ABP filter lists -> WebKit content rule lists (wraps Brave's adblock-rust)"

# Build-time tool only; nothing here ships in the app. adblock-rust is
# MPL-2.0 and fetched from crates.io at the pinned version (not vendored).
[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["content-blocking", "css-validation", "full-regex-handling", "embedded-domain-resolver"] }
serde_json = "1"

[profile.release]
debug = false
