name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: Forumind.xcodeproj
  SCHEME: Forumind
  # Matches the local toolchain (Xcode 27.2, 27B52). To fall back to the GA
  # macOS 26 image, set repo variables CI_MACOS_RUNNER=macos-26 and
  # CI_XCODE_APP=/Applications/Xcode_26.6.app.
  XCODE_APP: ${{ vars.CI_XCODE_APP || '/Applications/Xcode_27.2.app' }}

jobs:
  # Runner rule: in the private dev repo EVERY job runs on the self-hosted Mac,
  # matched by [self-hosted, macOS, xcode-27]. A bare 'xcode-27' matches
  # GitHub's paid hosted macOS image, so never use it there. The public repo
  # (free hosted minutes) uses ubuntu-latest, or CI_MACOS_RUNNER || 'xcode-27'
  # for Xcode jobs.
  lint:
    name: Lint (plists, scripts, workflows)
    runs-on: ${{ github.repository == 'kccarlos/forumind-dev' && fromJSON('["self-hosted","macOS","xcode-27"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lint property lists
        run: scripts/ci/lint-plists.sh
      - name: ShellCheck CI scripts
        run: shellcheck scripts/ci/*.sh scripts/adblock/*.sh
      - name: App Store metadata
        # Length limits, keywords, URLs, and screenshot sizes in appstore/.
        run: scripts/ci/check-appstore-metadata.sh
      - name: Generated site files are up to date
        # Privacy body, site directory, zh/ pages, hreflang lines and
        # sitemap in mobile-site/ come from scripts/site/render_site.py.
        run: scripts/ci/check-site.sh
      - name: Fastfile syntax
        run: ruby -c fastlane/Fastfile
      - name: Ad-blocking converter tests
        # Rust syntax-case tests (adblock-rust, build-time only) + Python
        # validator/chunking tests. ubuntu-latest ships cargo and python3;
        # the self-hosted Mac has them from Homebrew.
        run: scripts/adblock/run_tests.sh
      - name: actionlint
        run: |
          if command -v actionlint >/dev/null; then
            actionlint -color
          else
            bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
            "$RUNNER_TEMP/actionlint" -color
          fi

  project-drift:
    name: Generated project is up to date
    runs-on: ${{ github.repository == 'kccarlos/forumind-dev' && fromJSON('["self-hosted","macOS","xcode-27"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: '3.3'
      - name: Install xcodeproj gem
        # The self-hosted Mac uses its system Ruby, which already has the gem.
        run: ruby -rxcodeproj -e 'puts Xcodeproj::VERSION' 2>/dev/null || gem install xcodeproj --no-document --user-install
      - name: Compare committed project with generator output
        # Fails on drift; the log shows a UUID-free diff of what changed.
        run: scripts/ci/check-project-drift.sh
      - name: Site layering (only Forumind/Sites/ knows a platform)
        # Fails on a new platform-specific hit outside Sites/ and on a stale
        # entry in scripts/ci/site-layering-allowlist.txt.
        run: scripts/ci/check-site-layering.sh

  build-test:
    name: Build & unit tests
    runs-on: ${{ github.repository == 'kccarlos/forumind-dev' && fromJSON('["self-hosted","macOS","xcode-27"]') || vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    # DerivedData is intentionally not cached: no SPM packages, and Xcode's
    # incremental cache hit rate across runners is poor for a project this size.
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Pick simulator
        id: sim
        env:
          SIM_PREFER: iPhone 17 Pro,iPhone 18 Pro,iPhone 17,iPhone Air
        run: scripts/ci/pick-simulator.sh

      - name: Build and test
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
        run: |
          set -o pipefail
          formatter=(cat)
          if command -v xcbeautify >/dev/null; then formatter=(xcbeautify --renderer github-actions); fi
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:ForumindTests \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | "${formatter[@]}"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore

  release-build:
    # Catches Release-only compile errors (for example code behind `#if DEBUG`
    # that Release still references) without any signing material.
    name: Release build (device, unsigned)
    runs-on: ${{ github.repository == 'kccarlos/forumind-dev' && fromJSON('["self-hosted","macOS","xcode-27"]') || vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Build Release for generic iOS
        run: |
          set -o pipefail
          formatter=(cat)
          if command -v xcbeautify >/dev/null; then formatter=(xcbeautify --renderer github-actions); fi
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | "${formatter[@]}"
