name: Release

# Every push to main (each publish from the development repo) uploads a
# TestFlight build. Tag v1.2.3 to also publish a GitHub Release, or run it
# manually for metadata and review submission. Every signed step is skipped cleanly when the App Store
# Connect secrets or the DEVELOPMENT_TEAM variable are missing, so forks and
# fresh clones stay green. See docs/CI.md.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs and store texts don't change the app; metadata goes up manually.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'appstore/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.2.0). Empty keeps the project's version.
        type: string
        default: ''
      testflight:
        description: Archive, sign, and upload to TestFlight
        type: boolean
        default: true
      submit_metadata:
        description: Upload App Store metadata from appstore/ with fastlane deliver
        type: boolean
        default: false
      upload_screenshots:
        description: Also upload screenshots from appstore/screenshots (replaces existing ones)
        type: boolean
        default: false
      submit_for_review:
        description: Submit the version for App Review after uploading metadata
        type: boolean
        default: false

# Never cancel a release or upload midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: Forumind.xcodeproj
  SCHEME: Forumind
  XCODE_APP: ${{ vars.CI_XCODE_APP || '/Applications/Xcode_27.0.app' }}
  # Repo variables (Settings -> Secrets and variables -> Actions -> Variables).
  DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
  # App Store profiles (manual signing), created once with the distribution
  # certificate; see docs/CI.md.
  PROFILE_APP: Forumind App Store
  PROFILE_SHARE: Forumind Share App Store
  BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
  DC_ENABLE_PCC: ${{ vars.DC_ENABLE_PCC || 'NO' }}
  # Empty: CloudKit (iCloud sync) follows DEVELOPMENT_TEAM, so it is on in the
  # TestFlight build. NO turns it off.
  DC_ENABLE_CLOUDKIT: ${{ vars.DC_ENABLE_CLOUDKIT }}

jobs:
  # `secrets` can't be used in a job-level `if:`, so compute what can run here.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      asc: ${{ steps.check.outputs.asc }}
      signing: ${{ steps.check.outputs.signing }}
      metadata: ${{ steps.check.outputs.metadata }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - id: check
        env:
          # Signing material is in 1Password (vault github); this is the token.
          HAS_OP: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
          WANT_TESTFLIGHT: ${{ github.event_name != 'workflow_dispatch' || inputs.testflight }}
          WANT_METADATA: ${{ github.event_name == 'workflow_dispatch' && inputs.submit_metadata }}
        run: |
          asc=false signing=false metadata=false
          if [[ "$HAS_OP" == true ]]; then
            asc=true
          else
            echo "::notice::OP_SERVICE_ACCOUNT_TOKEN is not set; skipping TestFlight and metadata."
          fi
          if [[ "$asc" == true && "$WANT_TESTFLIGHT" == true ]]; then
            if [[ -z "$DEVELOPMENT_TEAM" ]]; then
              echo "::warning::Repo variable DEVELOPMENT_TEAM is not set; skipping the signed archive."
            else
              signing=true
            fi
          fi
          if [[ "$asc" == true && "$WANT_METADATA" == true ]]; then
            metadata=true
          fi
          {
            echo "asc=$asc"
            echo "signing=$signing"
            echo "metadata=$metadata"
          } >>"$GITHUB_OUTPUT"
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
          # Repo variable: the version main builds upload under, once the
          # project's own version has shipped (App Store Connect closes it).
          VAR_VERSION: ${{ vars.MARKETING_VERSION }}
          # Builds uploaded before this workflow ran (from Xcode) used low
          # numbers; CI numbers start above them and always go up.
          BUILD_BASE: ${{ vars.BUILD_NUMBER_BASE || '100' }}
        run: |
          # Tag v1.2.3 -> 1.2.3 (a pre-release suffix like -beta.1 is dropped:
          # App Store versions are numbers only). Manual runs use the input.
          version=""
          if [[ "$REF_TYPE" == tag && "$REF_NAME" =~ ^v([0-9]+(\.[0-9]+){0,2})(-.*)?$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "::error::version must look like 1.2.3 (got '$INPUT_VERSION')"
              exit 1
            fi
            version="$INPUT_VERSION"
          elif [[ -n "$VAR_VERSION" ]]; then
            version="$VAR_VERSION"
          fi
          build=$((BUILD_BASE + GITHUB_RUN_NUMBER))
          {
            echo "version=$version"
            echo "build=$build"
          } >>"$GITHUB_OUTPUT"
          echo "Marketing version: ${version:-<project default>}, build number: $build"

  simulator-build:
    name: Unsigned simulator build
    needs: preflight
    # Attached to GitHub Releases; CI already builds every push to main.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Build Release for iOS Simulator
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD: ${{ needs.preflight.outputs.build }}
        run: |
          set -o pipefail
          extra=()
          [[ -n "$VERSION" ]] && extra+=("MARKETING_VERSION=$VERSION")
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD" \
            "${extra[@]}" \
            | xcbeautify --renderer github-actions
      - name: Package .app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Release-iphonesimulator/Forumind.app \
            dist/Forumind-simulator.app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: simulator-app
          path: dist/Forumind-simulator.app.zip
          if-no-files-found: error

  testflight:
    name: Archive & upload to TestFlight
    needs: preflight
    if: needs.preflight.outputs.signing == 'true'
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    environment: testflight
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD: ${{ needs.preflight.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Generate project for this team and bundle ID
        # The committed project has no team and default IDs; regenerate with
        # the repo variables (DEVELOPMENT_TEAM, BUNDLE_ID_PREFIX, DC_ENABLE_PCC,
        # DC_ENABLE_CLOUDKIT). With a team, CloudKit is on.
        env:
          BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
        run: bundle exec ruby scripts/generate_project.rb

      # 1Password, three attempts 30 s apart: the CLI fails intermittently on
      # macOS 27 runners (see docs/CI.md). Values are step outputs, so only the
      # steps that name them see them; a failed attempt leaves its outputs empty.
      - name: Secrets from 1Password (attempt 1)
        id: op1
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APPLE_CERTIFICATE_P12_BASE64: op://github/apple-distribution/p12_base64
          APPLE_CERTIFICATE_PASSWORD: op://github/apple-distribution/password
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64
      - name: Wait before 1Password attempt 2
        if: steps.op1.outcome == 'failure'
        run: sleep 30
      - name: Secrets from 1Password (attempt 2)
        id: op2
        if: steps.op1.outcome == 'failure'
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APPLE_CERTIFICATE_P12_BASE64: op://github/apple-distribution/p12_base64
          APPLE_CERTIFICATE_PASSWORD: op://github/apple-distribution/password
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64
      - name: Wait before 1Password attempt 3
        if: steps.op2.outcome == 'failure'
        run: sleep 30
      - name: Secrets from 1Password (attempt 3)
        id: op3
        if: steps.op2.outcome == 'failure'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APPLE_CERTIFICATE_P12_BASE64: op://github/apple-distribution/p12_base64
          APPLE_CERTIFICATE_PASSWORD: op://github/apple-distribution/password
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64

      # Key and issuer IDs are identifiers, not secrets: exported for every step.
      - name: App Store Connect key IDs
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ steps.op1.outputs.APP_STORE_CONNECT_API_KEY_ID || steps.op2.outputs.APP_STORE_CONNECT_API_KEY_ID || steps.op3.outputs.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.op1.outputs.APP_STORE_CONNECT_ISSUER_ID || steps.op2.outputs.APP_STORE_CONNECT_ISSUER_ID || steps.op3.outputs.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "APP_STORE_CONNECT_API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" >>"$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >>"$GITHUB_ENV"

      - name: Install signing material
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ steps.op1.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 || steps.op2.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 || steps.op3.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ steps.op1.outputs.APPLE_CERTIFICATE_P12_BASE64 || steps.op2.outputs.APPLE_CERTIFICATE_P12_BASE64 || steps.op3.outputs.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.op1.outputs.APPLE_CERTIFICATE_PASSWORD || steps.op2.outputs.APPLE_CERTIFICATE_PASSWORD || steps.op3.outputs.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/import-signing.sh

      # Manual signing: the App Store profiles come from the API (read-only).
      # CI never creates certificates or profiles.
      - name: App Store profiles
        run: ruby scripts/ci/fetch-profiles.rb "$PROFILE_APP" "$PROFILE_SHARE"

      - name: Archive
        run: |
          set -o pipefail
          extra=()
          [[ -n "$VERSION" ]] && extra+=("MARKETING_VERSION=$VERSION")
          # The profile specifier is a build-setting expression, expanded per
          # target by xcodebuild (not by the shell).
          # shellcheck disable=SC2016
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Forumind.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            'PROVISIONING_PROFILE_SPECIFIER=$(DC_PROFILE_$(TARGET_NAME))' \
            DC_PROFILE_Forumind="$PROFILE_APP" \
            DC_PROFILE_ForumindShare="$PROFILE_SHARE" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            "${extra[@]}" \
            | xcbeautify --renderer github-actions

      - name: Export IPA
        run: |
          set -o pipefail
          scripts/ci/write-export-options.sh build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Forumind.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            | xcbeautify --renderer github-actions
          mkdir -p dist
          cp build/export/*.ipa dist/Forumind.ipa
          ditto -c -k --keepParent build/Forumind.xcarchive/dSYMs dist/Forumind-dSYMs.zip

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ steps.op1.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 || steps.op2.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 || steps.op3.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          # Submitting for review in this run needs the processed build.
          WAIT: ${{ github.event_name == 'workflow_dispatch' && inputs.submit_for_review }}
          # Repo variable: external groups (comma-separated) that get every
          # build, e.g. "Public beta". Empty: upload only.
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
        run: |
          # "What to Test": the commit message (the publish summary), unless
          # it is publish.sh's default; then the App Store release notes.
          subject="$(git log -1 --format=%s)"
          if [[ -n "$subject" && "$subject" != "Sync from development" ]]; then
            body="$(git log -1 --format=%B | sed -e '/^Claude-Session:/d')"
            export TESTFLIGHT_CHANGELOG="What's new: ${body}

          Please report anything that looks wrong or confusing through TestFlight feedback or GitHub issues."
          fi
          bundle exec fastlane beta ipa:dist/Forumind.ipa wait:"$WAIT" groups:"$TESTFLIGHT_GROUPS"

      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: dist/Forumind.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dsyms
          path: dist/Forumind-dSYMs.zip
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: scripts/ci/cleanup-signing.sh

  metadata:
    name: App Store metadata
    needs: [preflight, testflight]
    # Runs after the TestFlight job when both were requested, or on its own.
    if: >-
      always() && needs.preflight.outputs.metadata == 'true' &&
      (needs.testflight.result == 'success' || needs.testflight.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testflight
    steps:
      - uses: actions/checkout@v7
      - name: Validate metadata
        run: scripts/ci/check-appstore-metadata.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # 1Password, three attempts 30 s apart: the CLI fails intermittently on
      # macOS 27 runners (see docs/CI.md). Values are step outputs, so only the
      # steps that name them see them; a failed attempt leaves its outputs empty.
      - name: Secrets from 1Password (attempt 1)
        id: op1
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64
      - name: Wait before 1Password attempt 2
        if: steps.op1.outcome == 'failure'
        run: sleep 30
      - name: Secrets from 1Password (attempt 2)
        id: op2
        if: steps.op1.outcome == 'failure'
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64
      - name: Wait before 1Password attempt 3
        if: steps.op2.outcome == 'failure'
        run: sleep 30
      - name: Secrets from 1Password (attempt 3)
        id: op3
        if: steps.op2.outcome == 'failure'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64

      # Key and issuer IDs are identifiers, not secrets: exported for every step.
      - name: App Store Connect key IDs
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ steps.op1.outputs.APP_STORE_CONNECT_API_KEY_ID || steps.op2.outputs.APP_STORE_CONNECT_API_KEY_ID || steps.op3.outputs.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.op1.outputs.APP_STORE_CONNECT_ISSUER_ID || steps.op2.outputs.APP_STORE_CONNECT_ISSUER_ID || steps.op3.outputs.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "APP_STORE_CONNECT_API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" >>"$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >>"$GITHUB_ENV"

      - name: Upload metadata with fastlane deliver
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SCREENSHOTS: ${{ inputs.upload_screenshots }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ steps.op1.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 || steps.op2.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 || steps.op3.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          SUBMIT: ${{ inputs.submit_for_review }}
        run: |
          bundle exec fastlane metadata \
            version:"$VERSION" screenshots:"$SCREENSHOTS" submit:"$SUBMIT"

  github-release:
    name: GitHub Release
    needs: [preflight, simulator-build, testflight]
    # Runs on tags even when the TestFlight job was skipped (no secrets).
    if: >-
      always() && github.ref_type == 'tag' &&
      needs.simulator-build.result == 'success' &&
      (needs.testflight.result == 'success' || needs.testflight.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # The simulator build, plus dSYMs when TestFlight ran (not the IPA).
          pattern: '{simulator-app,dsyms}'
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
